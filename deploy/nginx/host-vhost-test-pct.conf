# Host nginx vhost for http://test-pct.kpndomain.com  (FE server 172.28.92.56)
#
# Port 80 on this server belongs to the package-installed nginx that fronts every
# application sharing the host. So the dashboard is NOT published on 80 — this
# vhost forwards the subdomain to the pct-web container on 3050, which then
# serves the SPA and proxies /api and /auth to the BE server.
#
# Install as /etc/nginx/conf.d/test-pct.conf (or sites-available + a symlink,
# whichever this host already uses), then:  nginx -t && systemctl reload nginx
#
# Deliberately NOT default_server: an unknown Host must keep hitting whatever
# this nginx served before, so adding the dashboard cannot change another app's
# behaviour.

server {
    listen 80;
    listen [::]:80;
    server_name test-pct.kpndomain.com;

    server_tokens off;

    # REQUIRED, and the easiest thing to miss: the SAP upload posts six files of
    # up to 60 MB. nginx defaults to 1 MB, and the rejection surfaces as a 413
    # from this proxy — before the container's own 210m limit is ever consulted.
    client_max_body_size 210m;
    client_body_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host must be forwarded verbatim. Without it the backend issues its
        # session cookie for the wrong name, the browser never sends it back,
        # and login appears to succeed while bouncing to the sign-in page.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An ingest or a forced recompute holds the request open for minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Server-sent progress must not be buffered into silence.
        proxy_buffering off;
    }
}
