upstream pct_api {
    server api:3000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # 6 files x 60 MB plus multipart overhead
    client_max_body_size 210m;
    client_body_timeout 300s;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # ── API and auth: single origin, so the session cookie is first-party ──
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://pct_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # REQUIRED. Without it the backend sets the cookie for an internal
        # hostname, the browser never sends it back, and login appears to succeed
        # server-side while the user is bounced to the login screen forever.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /auth/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://pct_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static SPA ──
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or a deploy leaves stale asset refs.
        add_header Cache-Control "no-cache" always;
    }
}
