# Security headers.
#
# MUST be included in EVERY location block, not only at server level.
#
# nginx's add_header directives are not merged across nesting levels: if a
# location block declares any add_header of its own, it REPLACES all inherited
# ones. Setting these once on the server block silently loses them wherever a
# location adds Cache-Control — which is every location that matters.
#
# No CDN anywhere in the bundle, so a strict CSP is achievable. 'unsafe-inline'
# is required only for style-src, because Chart.js sets inline canvas styles.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
