# Production FE server (172.28.80.50). Serves the SPA and reverse-proxies /api
# and /auth to the BE server - single origin, so the session cookie stays
# first-party. Published on the server's PRIVATE IP, 172.28.80.50:3050: users
# open http://172.28.80.50:3050 until pct.kpndomain.com is ready, and then the
# host's nginx vhost forwards the hostname to this same address - so the
# domain switch changes no container (Docs/DEPLOY_PRODUCTION.md 7b).
# Guide: Docs/DEPLOY_PRODUCTION.md.
#
# Required next to this file (/opt/pct):
#   production.conf  - from deploy/production/nginx/production.conf
#   .env             - PCT_SUBNET (and PCT_WEB_BIND), read by Compose
name: pct

services:
  web:
    image: pct-web:production
    container_name: pct-web
    restart: unless-stopped
    volumes:
      # Overrides the baked-in local config: upstream is the BE server.
      - ./production.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # The private IP only - never 0.0.0.0 and never 80 (the host nginx's).
      - "${PCT_WEB_BIND:-172.28.80.50:3050}:80"
    networks: [pct]

networks:
  pct:
    name: pct_net
    ipam:
      config:
        # A fixed subnet, so PCT can never take a range another app or the NAS
        # depends on. Chosen by deploy/production/preflight.sh fe.
        - subnet: ${PCT_SUBNET:?set PCT_SUBNET in /opt/pct/.env - run deploy/production/preflight.sh fe}
