# Host nginx vhost for http://pct.kpndomain.com  (FE server 172.28.80.50)
#
# Port 80 on this server belongs to the shared front proxy for every
# application on the host, so PCT is NOT published on 80: this vhost forwards
# the hostname to the pct-web container on 127.0.0.1:3050.
#
# Install as /etc/nginx/conf.d/pct.conf (or sites-available + symlink, whichever
# this host already uses), then:  nginx -t && systemctl reload nginx
#
# Deliberately NOT default_server: an unknown Host keeps reaching whatever this
# nginx served before, so adding PCT cannot change another app's behaviour.
#
# When TLS arrives: add a `listen 443 ssl;` server with the certificate, keep
# this one as a redirect, and switch production.env to NODE_ENV=production with
# SESSION_COOKIE_SECURE=true (Docs/DEPLOY_PRODUCTION.md, "Going to HTTPS").

server {
    listen 80;
    listen [::]:80;
    server_name pct.kpndomain.com;

    server_tokens off;

    # The SAP upload posts up to six files of 60 MB. nginx defaults to 1 MB,
    # and the rejection would be a 413 from THIS proxy.
    client_max_body_size 210m;
    client_body_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Forward Host verbatim, or the session cookie is issued for the wrong name.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An ingest or a rebuild holds the request open for minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
