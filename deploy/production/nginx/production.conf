upstream pct_api {
    # Production BE server (pct-api published on 172.28.80.51:4100). Keep in
    # sync with deploy/production/be.compose.yml and Docs/DEPLOY_PRODUCTION.md.
    server 172.28.80.51:4100 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name pct.kpndomain.com;

    server_tokens off;

    # 6 files x 60 MB plus multipart overhead
    client_max_body_size 210m;
    client_body_timeout 300s;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # ── API and auth: single origin, so the session cookie is first-party ──
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://pct_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # REQUIRED: without it the session cookie is issued for the wrong host
        # and every sign-in bounces back to the login page.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /auth/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://pct_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static SPA ──
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or a deploy leaves stale asset refs.
        add_header Cache-Control "no-cache" always;
    }
}
