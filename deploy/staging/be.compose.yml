# Staging BE server (172.28.92.57). Runs the API (published on 4100, private
# IP) and its private Redis (never published). Postgres is remote on the DB
# server. Images arrive via docker load (see Docs/DEPLOY_STAGING.md) — this
# file never builds.
#
# Required next to this file:
#   staging.env          — copied from deploy/env/staging.env, secrets filled in
#   secrets.staging.env  — Coupa credentials (optional; integrations off without it)
#   assets/              — the SAP export files (read-only share stand-in)
name: pct

services:
  redis:
    image: redis:7.4-alpine
    container_name: pct-redis
    restart: unless-stopped
    # noeviction is deliberate: Redis holds sessions, not just cache.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: pct-api:staging
    container_name: pct-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./staging.env
      - path: ./secrets.staging.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      SHARE_PATH: /mnt/sap_exports
      UPLOAD_SPOOL_PATH: /var/lib/pct/spool
    volumes:
      # Read-only exactly as the production CIFS mount will be — an application
      # defect can never modify or delete a source file.
      - ./assets:/mnt/sap_exports:ro
      - spool:/var/lib/pct/spool
    ports:
      - "172.28.92.57:4100:3000"
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  redisdata:
  spool:
