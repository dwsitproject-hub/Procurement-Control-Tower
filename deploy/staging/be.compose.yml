# Staging BE server (172.28.92.57). Runs the API (published on 4100, private
# IP) and its private Redis (never published). Postgres is remote on the DB
# server. Images arrive via docker load (see Docs/DEPLOY_STAGING.md) — this
# file never builds.
#
# Required next to this file:
#   staging.env          — copied from deploy/env/staging.env, secrets filled in
#   secrets.staging.env  — Coupa credentials (optional; integrations off without it)
#   assets/              — the SAP export files (fallback when the NAS is unset)
#
# The Synology NAS is bound read-only from the host mount (STORAGE_HOST_MOUNT,
# default /mnt/synology/eos). If this server does not mount the NAS, leave the
# STORAGE_* block in staging.env commented out and the app keeps reading
# assets/ — the bind below is then an empty folder and nothing reads it.
name: pct

services:
  redis:
    image: redis:7.4-alpine
    container_name: pct-redis
    restart: unless-stopped
    # noeviction is deliberate: Redis holds sessions, not just cache.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: pct-api:staging
    container_name: pct-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./staging.env
      - path: ./secrets.staging.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      SHARE_PATH: /mnt/sap_exports
      UPLOAD_SPOOL_PATH: /var/lib/pct/spool
    volumes:
      # The shared Synology NAS (Docs/SYNOLOGY-INTEGRATION.md). Bound READ-ONLY:
      # this app only READS the six SAP exports that land in its project folder,
      # so an application defect can never modify or delete one. Override the
      # host path with STORAGE_HOST_MOUNT if this server mounts it elsewhere.
      # NOTE: /mnt/synology-apps on 172.28.92.57 was a LOCAL folder, not a mount,
      # when this was written - see Docs/DEPLOY_STAGING.md 3a.
      #
      # Docker CREATES AN EMPTY FOLDER instead of failing when the host path is
      # absent, which is why the API probes the mount at boot and the Admin ->
      # SAP Data Upload panel reports whether the folder is really the NAS.
      - ${STORAGE_HOST_MOUNT:-/mnt/synology-apps}:/mnt/synology-apps:ro
      # Fallback source, used while STORAGE_* is unset in staging.env.
      - ./assets:/mnt/sap_exports:ro
      - spool:/var/lib/pct/spool
    ports:
      - "172.28.92.57:4100:3000"
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  redisdata:
  spool:
