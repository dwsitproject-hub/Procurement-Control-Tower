# Staging FE server (172.28.92.56). Serves the SPA and reverse-proxies /api
# and /auth to the BE server — single origin, so the session cookie stays
# first-party. Published on 3050; the host's own nginx proxies
# http://test-pct.kpndomain.com to it (that nginx owns :80 for every app on
# this server).
#
# Required next to this file:
#   staging.conf — the nginx config from deploy/nginx/staging.conf
name: pct

services:
  web:
    image: pct-web:staging
    container_name: pct-web
    restart: unless-stopped
    volumes:
      # Overrides the baked-in local config: upstream points at the BE server
      # instead of a same-host api container.
      - ./staging.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 3050, NOT 80. Port 80 on this host belongs to a package-installed nginx
      # that fronts the other applications sharing the server, so the subdomain
      # reaches us through a vhost there rather than by taking the port —
      # see Docs/DEPLOY_STAGING.md 8.2.
      - "0.0.0.0:3050:80"
