name: pct

services:
  postgres:
    image: postgres:16.4-bookworm
    container_name: pct-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pct
      POSTGRES_USER: pct
      POSTGRES_PASSWORD: pct_local_dev
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: Asia/Jakarta
    # Dev-tuned for an 8 GB Docker Desktop allocation. The production values in
    # TECH 03 assume a dedicated 16 GB instance.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - default_statistics_target=200
      - -c
      - enable_partition_pruning=on
      - -c
      - enable_partitionwise_join=on
      - -c
      - enable_partitionwise_aggregate=on
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pct -d pct"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 512mb

  redis:
    image: redis:7.4-alpine
    container_name: pct-redis
    restart: unless-stopped
    # noeviction is deliberate: Redis holds sessions, not just cache. Under
    # allkeys-lru a memory spike would silently log every user out.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: pct-mailhog
    restart: unless-stopped
    # Captures all outbound mail so nobody is ever emailed from a dev machine.
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: pct-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./deploy/env/local.env
      # Gitignored secrets (Coupa credentials etc.) — optional so a fresh
      # clone still composes; integrations stay off until it exists.
      - path: ./deploy/env/secrets.local.env
        required: false
    environment:
      DATABASE_URL: postgres://pct:pct_local_dev@postgres:5432/pct
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SHARE_PATH: /mnt/sap_exports
      UPLOAD_SPOOL_PATH: /var/lib/pct/spool
    volumes:
      # The local stand-in for the Synology share, mounted READ-ONLY exactly as
      # the production CIFS mount is — so an application defect can never modify
      # or delete a source file.
      - ./Assets:/mnt/sap_exports:ro
      - spool:/var/lib/pct/spool
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: pct-web
    restart: unless-stopped
    depends_on:
      - api
    # Single origin: nginx serves the SPA and reverse-proxies /api and /auth to
    # the API. This is what makes the session cookie first-party, so SameSite=Lax
    # works over plain HTTP locally.
    ports:
      - "127.0.0.1:8081:80"

volumes:
  pgdata:
  redisdata:
  spool:
